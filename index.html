<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭内稟議 サポート</title>
<meta name="description" content="家庭内稟議のサポート・お問い合わせ・プライバシーポリシー。">
<style>
  :root{
    --bg:#F5F4F0;
    --panel:#FFFFFF;
    --line:#E2DFD8;
    --text:#1F2430;
    --muted:#6B6A66;
    --accent:#1F3456;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:64px 24px 96px}
  .brand{font-size:13px;letter-spacing:.18em;color:var(--muted)}
  h1{font-size:34px;line-height:1.4;margin:12px 0 4px;font-weight:700;color:var(--accent)}
  .tagline{color:var(--muted);margin:0 0 40px}
  h2{font-size:20px;margin:48px 0 12px;padding-top:24px;border-top:1px solid var(--line)}
  p{margin:0 0 16px}
  ul{margin:0 0 16px;padding-left:1.2em}
  li{margin-bottom:8px}
  .cards{display:grid;gap:12px;margin:32px 0 8px}
  a.card{
    display:block;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:18px 20px;text-decoration:none;color:var(--text);
  }
  a.card:hover{border-color:var(--accent)}
  a.card .t{font-weight:700}
  a.card .d{color:var(--muted);font-size:14px}
  a{color:var(--accent)}
  footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">RINGI</div>
  <h1>家庭内稟議 サポート</h1>
  <p class="tagline">ほしいものを、ちょっとだけまじめに相談する。二人のための購入稟議アプリ</p>
  <div class="cards">
    <a class="card" href="./support.html"><div class="t">サポート</div><div class="d">よくある質問・お問い合わせ</div></a>
    <a class="card" href="./privacy.html"><div class="t">プライバシーポリシー</div><div class="d">扱うデータと、その保存先について</div></a>
  </div>
  <h2>お問い合わせ</h2>
  <p>メール：<a href="mailto:ryufuji0113@gmail.com">ryufuji0113@gmail.com</a></p>
<footer>家庭内稟議 — 個人開発 / 藤原竜樹<br><a href="./">トップ</a> ・ <a href="./support.html">サポート</a> ・ <a href="./privacy.html">プライバシーポリシー</a></footer>
</main>
</body>
</html>
